name: Auto-merge Exercism syncs
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
